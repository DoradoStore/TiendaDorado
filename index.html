<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .filters {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .category-filter {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            flex: 1;
            min-width: 0;
            max-width: 100%;
        }

        .category-select-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .category-select {
            width: 100%;
            padding: 15px 45px 15px 20px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            color: #667eea;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        .category-select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .category-select option {
            padding: 12px;
            font-weight: 500;
        }

        .category-select-arrow {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #667eea;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .category-select-wrapper:hover .category-select-arrow {
            color: #764ba2;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #f5f5f5;
        }

        /* Carrusel */
        .carousel {
            position: relative;
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
        }

        .carousel-inner {
            position: relative;
            width: 100%;
            height: 200px;
        }

        .carousel-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .carousel-item.active {
            opacity: 1;
            position: relative;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: scale-down;
        }

        .carousel-control {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-control:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-control.prev {
            left: 10px;
        }

        .carousel-control.next {
            right: 10px;
        }

        .carousel-indicators {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .indicator.active {
            background: white;
            transform: scale(1.2);
        }

        .product-category {
            display: inline-block;
            padding: 5px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .product-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: #667eea;
            margin-bottom: 10px;
        }

        .product-description {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .product-details {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .product-details p {
            margin-bottom: 8px;
        }

        .product-details strong {
            color: #333;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5rem;
            padding: 50px;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 50px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
        }

        .stats {
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: 100%;
            }

            .category-filter {
                justify-content: center;
            }

            .category-select-wrapper {
                max-width: 100%;
            }

            .category-select {
                padding: 12px 40px 12px 15px;
                font-size: 0.95rem;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 180px;
            }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s ease;
            box-sizing: border-box;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 35px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            z-index: 10;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-body {
            padding: 30px;
        }

        .modal-carousel {
            position: relative;
            margin-bottom: 25px;
            border-radius: 10px;
            overflow: hidden;
        }

        .modal-carousel-inner {
            position: relative;
            width: 100%;
            min-height: 400px;
            max-height: 600px;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        .modal-carousel-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            overflow: visible;
        }

        .modal-carousel-item.active {
            opacity: 1;
            position: relative;
        }

        .modal-carousel-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            width: auto;
            height: auto;
        }

        .modal-carousel-control {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-carousel-control:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: translateY(-50%) scale(1.1);
        }

        .modal-carousel-control.prev {
            left: 15px;
        }

        .modal-carousel-control.next {
            right: 15px;
        }

        .modal-carousel-indicators {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .modal-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-indicator:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .modal-indicator.active {
            background: white;
            transform: scale(1.2);
        }

        .modal-category {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .modal-price {
            font-size: 2rem;
            font-weight: 800;
            color: #667eea;
            margin-bottom: 20px;
        }

        .modal-description {
            color: #666;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .modal-video {
            margin-top: 25px;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
            max-width: 100%;
        }

        .modal-video iframe {
            width: 100%;
            height: 350px;
            border: none;
            border-radius: 10px;
            display: block;
        }

        .modal-video-error {
            margin-top: 25px;
            padding: 20px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            color: #856404;
        }

        .modal-video-error p {
            margin-bottom: 10px;
        }

        .modal-video-error a {
            color: #667eea;
            text-decoration: underline;
        }

        .modal-video-error a:hover {
            color: #764ba2;
        }

        .modal-details {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid #e0e0e0;
        }

        .modal-details h3 {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 15px;
        }

        .modal-details p {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .modal-details strong {
            color: #333;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .modal-content {
                width: 95%;
                margin: 5% auto;
                max-height: 95vh;
            }

            .modal-body {
                padding: 15px;
            }

            .modal-carousel-inner {
                height: 200px;
            }

            .modal-title {
                font-size: 1.5rem;
            }

            .modal-price {
                font-size: 1.5rem;
            }

            .modal-video {
                width: 100%;
                overflow: hidden;
                position: relative;
                padding-bottom: 56.25%; /* 16:9 aspect ratio */
                height: 0;
            }

            .modal-video iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border-radius: 8px;
            }
        }

        @media (max-width: 480px) {
            .modal-video iframe {
                height: 180px;
            }
        }

        /* Icono del carrito */
        .cart-icon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .cart-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .cart-icon svg {
            color: white;
            width: 28px;
            height: 28px;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        /* Modal del carrito */
        .cart-modal-content {
            max-width: 500px;
        }

        .cart-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .empty-cart {
            text-align: center;
            color: #999;
            font-size: 1.1rem;
            padding: 40px 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            gap: 15px;
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: #667eea;
            font-weight: 700;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item-quantity button {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .cart-item-quantity button:hover {
            background: #f5f5f5;
        }

        .cart-item-quantity span {
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            transition: all 0.3s ease;
        }

        .cart-item-remove:hover {
            color: #ff6b81;
            transform: scale(1.1);
        }

        .cart-total {
            text-align: right;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .cart-total h3 {
            font-size: 1.5rem;
            color: #333;
        }

        .cart-total span {
            color: #667eea;
            font-weight: 800;
        }

        .cart-actions {
            display: flex;
            gap: 10px;
        }

        .btn-whatsapp {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 20px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-2px);
        }

        .btn-clear {
            padding: 15px 20px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-clear:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }

        /* Botón agregar al carrito en tarjeta */
        .add-to-cart-btn {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-to-cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .add-to-cart-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Sección de vendedor en el carrito */
        .cart-seller-section {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .cart-seller-section h3 {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 15px;
        }

        .current-seller {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 2px solid #667eea;
        }

        .seller-label {
            color: #666;
            font-size: 0.9rem;
        }

        .seller-name {
            color: #333;
            font-weight: 600;
            font-size: 1rem;
        }

        .seller-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .seller-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .change-seller-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
            padding: 5px;
            margin-top: 10px;
        }

        .change-seller-btn:hover {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Catálogo de Productos</h1>
           
            <p id="sheetInfo" style="font-size: 0.9rem; margin-top: 10px; opacity: 0.8;"></p>
        </div>

        <div class="filters">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar productos...">
            </div>
            <div class="category-filter" id="categoryFilter">
                <div class="category-select-wrapper">
                    <select class="category-select" id="categorySelect">
                        <option value="all">Todos</option>
                    </select>
                    <span class="category-select-arrow">▼</span>
                </div>
            </div>
        </div>

        <div class="stats" id="stats">Cargando productos...</div>

        <div class="products-grid" id="productsGrid">
            <div class="loading">Cargando productos...</div>
        </div>
    </div>

    <!-- Icono del carrito -->
    <div class="cart-icon" onclick="openCart()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-count" id="cartCount">0</span>
    </div>

    <!-- Modal de producto -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-body" id="modalBody">
                <!-- El contenido se llenará dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Modal del carrito -->
    <div class="modal" id="cartModal">
        <div class="modal-content cart-modal-content">
            <span class="close-btn" onclick="closeCart()">&times;</span>
            <div class="modal-body">
                <h2 class="cart-title">Tu Carrito</h2>
                <div class="cart-items" id="cartItems">
                    <p class="empty-cart">Tu carrito está vacío</p>
                </div>
                <div class="cart-seller-section">
                    <h3>Vendedor</h3>
                    <div id="currentSeller" class="current-seller" style="display: none;">
                        <span class="seller-label">Enviando a:</span>
                        <span class="seller-name" id="sellerName"></span>
                    </div>
                    <select id="sellerSelect" class="seller-select" style="display: none;">
                        <option value="">Selecciona un vendedor</option>
                    </select>
                </div>
                <div class="cart-total">
                    <h3>Total: <span id="cartTotal">$0.00</span></h3>
                </div>
                <div class="cart-actions">
                    <button class="btn-whatsapp" onclick="sendToWhatsApp()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        Enviar por WhatsApp
                    </button>
                    <button class="btn-clear" onclick="clearCart()">Vaciar Carrito</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
